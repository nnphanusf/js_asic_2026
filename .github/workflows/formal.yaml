name: formal
on: [push, workflow_dispatch]
jobs:
  formal:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job: [fifo, host_spi, sm_props, opendrain, clkdiv]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}  # avoids the anonymous API rate limit

      - name: Run SymbiYosys
        run: |
          cd formal
          sby -f ${{ matrix.job }}.sby

      - name: Upload counterexamples
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: formal-${{ matrix.job }}
          path: formal/${{ matrix.job }}*/
